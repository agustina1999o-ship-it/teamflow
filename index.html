.flex{display:flex}.flex-col{flex-direction:column}.gap-2{gap:8px}.gap-4{gap:16px}.gap-6{gap:24px}.items-center{align-items:center}.justify-between{justify-content:space-between}

.layout{display:flex;min-height:100vh}

.header{height:64px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 32px;justify-content:space-between}

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useContext,createContext,useRef,useMemo}=React;

const SUPABASE_URL = 'https://semeysvpzwyaqhdippfo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_sGe8Da0mHSjdT5z6xs6qdw_YDde41U8';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ROLES_ADMIN = ['gerente','senior'];
const isAdmin = (rol) => ROLES_ADMIN.includes(rol);
const ANIO_ACTUAL = new Date().getFullYear();
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

// Avance ponderado por peso de etapa
const calcAvance = (pid, tasks, stages) => {
  const pStages = stages.filter(s => s.project_id === pid);
  if (pStages.length === 0) {
    const pts = tasks.filter(t => t.project_id === pid);
    return pts.length ? Math.round((pts.filter(t => t.estado === 'completada').length / pts.length) * 100) : 0;
  }
  let sumPeso = 0, sumPesoAvance = 0;
  pStages.forEach(st => {
    const stTasks = tasks.filter(t => t.stage_id === st.id);
    const stPct = stTasks.length ? (stTasks.filter(t => t.estado === 'completada').length / stTasks.length) : 0;
    sumPeso += st.peso;
    sumPesoAvance += st.peso * stPct;
  });
  return sumPeso > 0 ? Math.round((sumPesoAvance / sumPeso) * 100) : 0;
};

// Horas de vacaciones por usuario/mes (dias habiles * 8h)
const calcVacHours = (vacations, uid, mes, anio) => {
  const uVacs = vacations.filter(v => v.user_id === uid);
  let days = 0;
  const mStart = new Date(anio, mes - 1, 1);
  const mEnd = new Date(anio, mes, 0);
  uVacs.forEach(v => {
    const vs = new Date(v.fecha_inicio);
    const ve = new Date(v.fecha_fin);
    const s = vs > mStart ? vs : mStart;
    const e = ve < mEnd ? ve : mEnd;
    if (s > e) return;
    const d = new Date(s);
    while (d <= e) { if (d.getDay() !== 0 && d.getDay() !== 6) days++; d.setDate(d.getDate() + 1); }
  });
  return days * 8;
};

const DataCtx = createContext();
const AuthCtx = createContext();
const ToastCtx = createContext();

// PROVIDERS
function ToastProvider({children}){
  const [toasts,setToasts]=useState([]);
  const toast=(msg,type='success')=>{
    const id=Math.random();
    setToasts(t=>[...t,{id,msg,type}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),4000);
  };
  return(
    <ToastCtx.Provider value={toast}>
      {children}
      <div style={{position:'fixed',bottom:24,right:24,zindex:9999,display:'flex',flexDirection:'column',gap:12}}>
        {toasts.map(t=>(
          <div key={t.id} style={{padding:'14px 20px',borderRadius:10,color:'#fff',fontSize:14,fontWeight:600,background:t.type==='error'?'#ef4444':'#22c55e',boxShadow:'0 10px 15px -3px rgba(0,0,0,0.1)'}}>
            {t.msg}
          </div>
        ))}
      </div>
    </ToastCtx.Provider>
  );
}

function AuthProvider({children}){
  const [user,setUser]=useState(null);
  const [profile,setProfile]=useState(null);
  const [loading,setLoading]=useState(true);
  const load=async(u)=>{
    if(!u){setProfile(null);setLoading(false);return;}
    // Intenta primero por auth_user_id (post-migración multi-tenant)
    let {data}=await sb.from('profiles').select('*').eq('auth_user_id',u.id).single();
    // Si no encuentra, usa el id directo (usuarios demo existentes con id = auth.users.id)
    if(!data){
      const res=await sb.from('profiles').select('*').eq('id',u.id).single();
      data=res.data||null;
    }
    setProfile(data); setLoading(false);
  };
  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{setUser(session?.user);load(session?.user);});
    const {data:{subscription}}=sb.auth.onAuthStateChange((_e,s)=>{setUser(s?.user);load(s?.user);});
    return ()=>subscription.unsubscribe();
  },[]);
  return <AuthCtx.Provider value={{user,profile,loading}}>{children}</AuthCtx.Provider>;
}

function DataProvider({children}){
  const [data,setData]=useState({projects:[],tasks:[],stages:[],profiles:[],notes:[],hours:[],vacations:[],audit:[],capacity:[]});
  const reload=async()=>{
    const [p,t,s,u,n,h,v,a,c]=await Promise.all([
      sb.from('projects').select('*').order('created_at',{ascending:false}),
      sb.from('tasks').select('*'),
      sb.from('project_stages').select('*').order('orden'),
      sb.from('profiles').select('*'),
      sb.from('project_notes').select('*, profiles(nombre)'),
      sb.from('hour_assignments').select('*'),
      sb.from('vacations').select('*'),
      sb.from('audit_log').select('*, profiles(nombre)').order('created_at',{ascending:false}).limit(100),
      sb.from('user_capacity').select('*')
    ]);
    setData({projects:p.data||[],tasks:t.data||[],stages:s.data||[],profiles:u.data||[],notes:n.data||[],hours:h.data||[],vacations:v.data||[],audit:a.data||[],capacity:c.data||[]});
  };
  useEffect(()=>{reload();},[]);
  return <DataCtx.Provider value={{...data,reload}}>{children}</DataCtx.Provider>;
}

// HELPERS UI
const ProgressBar = ({value,color}) => (
  <div className="progress-bar"><div className="progress-fill" style={{width:`${value}%`,background:color||'var(--accent)'}}/></div>
);
const Avatar = ({name,color,size=36}) => (
  <div className="avatar" style={{width:size,height:size,background:color||'#475569',fontSize:size*0.4}}>{name?name[0].toUpperCase():'?'}</div>
);

// CONFIRM MODAL
function ConfirmModal({open,onClose,onConfirm,title}){
  if(!open) return null;
  return(
    <div className="modal-overlay"><div className="modal">
      <h3 className="mb-6" style={{fontSize:18,fontWeight:800}}>{title||'Confirmar accion'}</h3>
      <p className="text-muted mb-8">Esta accion no se puede deshacer.</p>
      <div className="flex justify-between"><button className="btn-ghost" onClick={onClose}>Cancelar</button><button className="btn-danger" onClick={()=>{onConfirm();onClose();}}>Eliminar</button></div>
    </div></div>
  );
}

// PROJECT FORM
function ProjectForm({editing,onClose,reload}){
  const {profiles}=useContext(DataCtx);
  const {profile}=useContext(AuthCtx);
  const toast=useContext(ToastCtx);
  const [f,setF]=useState({nombre:editing?.nombre||'',tipo:editing?.tipo||'cliente',cliente:editing?.cliente||'',descripcion:editing?.descripcion||'',fecha_inicio:editing?.fecha_inicio||new Date().toISOString().split('T')[0],fecha_fin:editing?.fecha_fin||'',estado:editing?.estado||'planificado',prioridad:editing?.prioridad||'media',color:editing?.color||'#3b82f6',presupuesto_horas:editing?.presupuesto_horas||100,nivel_riesgo:editing?.nivel_riesgo||'sin_riesgo'});
  const s=(k,v)=>setF(x=>({...x,[k]:v}));
  const save=async()=>{
    if(!f.nombre||!f.fecha_fin){toast('Nombre y fecha fin son requeridos','error');return;}
    const payload={...f,presupuesto_horas:parseInt(f.presupuesto_horas)};
    if(editing){
      await sb.from('projects').update(payload).eq('id',editing.id);
      toast('Proyecto actualizado');
    } else {
      payload.created_by=profile.id;
      await sb.from('projects').insert(payload);
      toast('Proyecto creado');
    }
    reload(); onClose();
  };
  return(
    <div className="modal-overlay"><div className="modal" style={{maxWidth:600,maxHeight:'90vh',overflowY:'auto'}}>
      <h3 className="mb-8" style={{fontSize:22,fontWeight:800}}>{editing?'Editar Proyecto':'Nuevo Proyecto'}</h3>
      <div className="form-group"><label>Nombre *</label><input value={f.nombre} onChange={e=>s('nombre',e.target.value)}/></div>
      <div className="grid" style={{gridTemplateColumns:'1fr 1fr',gap:16}}>
        <div className="form-group"><label>Tipo</label><select value={f.tipo} onChange={e=>s('tipo',e.target.value)}><option value="cliente">Cliente</option><option value="interno">Interno</option></select></div>
        <div className="form-group"><label>Cliente</label><input value={f.cliente} onChange={e=>s('cliente',e.target.value)}/></div>
      </div>
      <div className="form-group"><label>Descripcion</label><textarea value={f.descripcion} onChange={e=>s('descripcion',e.target.value)} rows="3"/></div>
      <div className="grid" style={{gridTemplateColumns:'1fr 1fr',gap:16}}>
        <div className="form-group"><label>Fecha Inicio *</label><input type="date" value={f.fecha_inicio} onChange={e=>s('fecha_inicio',e.target.value)}/></div>
        <div className="form-group"><label>Fecha Fin *</label><input type="date" value={f.fecha_fin} onChange={e=>s('fecha_fin',e.target.value)}/></div>
      </div>
      <div className="grid" style={{gridTemplateColumns:'1fr 1fr 1fr',gap:16}}>
        <div className="form-group"><label>Estado</label><select value={f.estado} onChange={e=>s('estado',e.target.value)}><option value="planificado">Planificado</option><option value="activo">Activo</option><option value="pausado">Pausado</option><option value="finalizado">Finalizado</option><option value="cancelado">Cancelado</option></select></div>
        <div className="form-group"><label>Prioridad</label><select value={f.prioridad} onChange={e=>s('prioridad',e.target.value)}><option value="alta">Alta</option><option value="media">Media</option><option value="baja">Baja</option></select></div>
        <div className="form-group"><label>Horas Presup.</label><input type="number" value={f.presupuesto_horas} onChange={e=>s('presupuesto_horas',e.target.value)}/></div>
      </div>
      <div className="flex justify-between mt-8"><button className="btn-ghost" onClick={onClose}>Cancelar</button><button className="btn" onClick={save}>Guardar</button></div>
    </div></div>
  );
}

// VISTAS
function Login(){
  const [email,setEmail]=useState('');
  const [pass,setPass]=useState('123456');
  const [nombre,setNombre]=useState('');
  const [username,setUsername]=useState('');
  const [isSignUp,setIsSignUp]=useState(false);
  const [isForgotPassword,setIsForgotPassword]=useState(false);
  const toast=useContext(ToastCtx);

  const handle=async(e)=>{
    e.preventDefault();
    if(isForgotPassword){
      const {error}=await sb.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + window.location.pathname
      });
      if(error){
        toast(error.message,'error');
      } else {
        toast('Enlace de recuperación enviado. Revisa tu correo.','success');
        setIsForgotPassword(false);
      }
      return;
    }

    if(isSignUp){
      if(!nombre||!username){
        toast('Por favor completa todos los campos','error');
        return;
      }
      const cleanUsername = username.toLowerCase().replace(/[^a-z0-9]/g, '');
      const {data, error}=await sb.auth.signUp({
        email,
        password: pass,
        options: {
          data: {
            nombre: nombre,
            username: cleanUsername
          }
        }
      });
      if(error) {
        toast(error.message,'error');
      } else {
        toast('Cuenta registrada con éxito. Iniciando sesión...','success');
      }
    } else {
      const {error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error) toast(error.message,'error');
    }
  };

  return(
    <div className="flex items-center justify-center" style={{minHeight:'100vh',background:'radial-gradient(circle at top right, var(--surface), var(--bg))'}}>
      <div className="card animate-in" style={{width:400,padding:40}}>
        <h1 style={{textAlign:'center',marginBottom:40,fontSize:32,fontWeight:900,color:'var(--accent)'}}>TeamFlow</h1>
        
        {isForgotPassword ? (
          <form onSubmit={handle} className="flex flex-col gap-6">
            <h3 style={{textAlign:'center',fontSize:18,fontWeight:700,marginBottom:10}}>Recuperar Contraseña</h3>
            <p className="text-xs text-muted text-center" style={{marginTop:-10}}>Ingresá tu correo y te enviaremos un enlace para restablecer tu contraseña.</p>
            <div className="form-group"><label>Email Corporativo</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} required placeholder="ejemplo@llyasoc.com"/></div>
            <button className="btn w-full" style={{padding:14,fontSize:16}}>Enviar Enlace</button>
            <button type="button" className="btn-ghost btn-sm w-full" onClick={()=>setIsForgotPassword(false)}>Volver a Iniciar Sesión</button>
          </form>
        ) : (
          <>
            <form onSubmit={handle} className="flex flex-col gap-6">
              {isSignUp && (
                <>
                  <div className="form-group"><label>Nombre Completo</label><input type="text" value={nombre} onChange={e=>setNombre(e.target.value)} required placeholder="Ej. Tu Nombre"/></div>
                  <div className="form-group"><label>Nombre de Usuario</label><input type="text" value={username} onChange={e=>setUsername(e.target.value)} required placeholder="ej. tunombre"/></div>
                </>
              )}
              <div className="form-group"><label>Email Corporativo</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} required placeholder="ejemplo@llyasoc.com"/></div>
              <div className="form-group">
                <label>Contraseña</label>
                <input type="password" value={pass} onChange={e=>setPass(e.target.value)} required/>
                {!isSignUp && (
                  <div style={{textAlign:'right',marginTop:6}}>
                    <span className="text-xs text-muted" style={{cursor:'pointer',textDecoration:'underline'}} onClick={()=>setIsForgotPassword(true)}>¿Olvidaste tu contraseña?</span>
                  </div>
                )}
              </div>
              <button className="btn w-full" style={{padding:14,fontSize:16}}>{isSignUp ? 'Crear Cuenta' : 'Entrar al Sistema'}</button>
            </form>

            <div style={{marginTop:24,textAlign:'center'}}>
              <button className="btn-ghost btn-sm w-full" onClick={()=>setIsSignUp(!isSignUp)}>
                {isSignUp ? '¿Ya tienes cuenta? Inicia Sesión' : '¿No tienes cuenta? Regístrate gratis'}
              </button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function Dashboard(){
  const {projects,tasks,stages,profiles,hours,capacity,vacations,audit}=useContext(DataCtx);
  const mesActual=new Date().getMonth()+1;
  const active=projects.filter(p=>p.estado==='activo').length;
  const finished=projects.filter(p=>p.estado==='finalizado').length;
  const avgProgress=projects.length?Math.round(projects.reduce((a,p)=>a+calcAvance(p.id,tasks,stages),0)/projects.length):0;
  const totalTasks=tasks.length;
  const completedTasks=tasks.filter(t=>t.estado==='completada').length;
  const blockedTasks=tasks.filter(t=>t.estado==='bloqueada').length;

  const getMonthHours=(uid)=>hours.filter(h=>h.user_id===uid&&h.mes===mesActual&&h.anio===ANIO_ACTUAL).reduce((a,b)=>a+Number(b.horas_planificadas),0);
  const getMonthCap=(u)=>{
    const rec=capacity.find(c=>c.user_id===u.id&&c.mes===mesActual&&c.anio===ANIO_ACTUAL);
    const base=rec?Math.max(0,(rec.horas_totales||160)-(rec.horas_ociosas||0)):(u.horas_disponibles_default||160);
    return Math.max(0,base-calcVacHours(vacations,u.id,mesActual,ANIO_ACTUAL));
  };
  const totalHorasAsig=profiles.reduce((a,u)=>a+getMonthHours(u.id),0);
  const totalHorasDisp=profiles.reduce((a,u)=>a+getMonthCap(u),0);

  const estadoColor={activo:'var(--green)',planificado:'var(--accent)',pausado:'var(--yellow)',finalizado:'var(--muted)',cancelado:'var(--red)'};
  const prioColor={alta:'var(--red)',media:'var(--yellow)',baja:'var(--green)'};

  return(
    <div className="animate-in">
      <h2 className="section-title">Resumen Ejecutivo</h2>
      <div className="grid" style={{gridTemplateColumns:'repeat(auto-fill, minmax(180px, 1fr))',gap:16,marginBottom:32}}>
        <div className="card" style={{borderLeft:'4px solid var(--accent)',padding:20}}>
          <div className="text-xs text-muted font-bold uppercase mb-2">Proyectos Activos</div>
          <div style={{fontSize:36,fontWeight:900}}>{active}</div>
          <div className="text-xs text-muted mt-1">{finished} finalizados</div>
        </div>
        <div className="card" style={{borderLeft:'4px solid var(--green)',padding:20}}>
          <div className="text-xs text-muted font-bold uppercase mb-2">Avance Promedio</div>
          <div style={{fontSize:36,fontWeight:900}}>{avgProgress}%</div>
          <ProgressBar value={avgProgress} color="var(--green)"/>
        </div>
        <div className="card" style={{borderLeft:'4px solid var(--yellow)',padding:20}}>

  const delStage=async(id)=>{ await sb.from('tasks').delete().eq('stage_id',id); await sb.from('project_stages').delete().eq('id',id); toast('Etapa eliminada'); reload(); };

        <div className="card">

function StageForm({projectId,editing,onClose,reload}){
  const {profiles,stages}=useContext(DataCtx);
  const [f,setF]=useState({nombre:editing?.nombre||'',peso:editing?.peso||5,responsable_id:editing?.responsable_id||''});
  const toast=useContext(ToastCtx);
  const save=async()=>{
    if(!f.nombre){toast('Nombre requerido','error');return;}
    const orden=editing?.orden||(stages.filter(s=>s.project_id===projectId).length+1);
    const payload={nombre:f.nombre,peso:parseInt(f.peso)||5,responsable_id:f.responsable_id||null,project_id:projectId,orden};
    if(editing) await sb.from('project_stages').update(payload).eq('id',editing.id);
    else await sb.from('project_stages').insert(payload);
    toast(editing?'Etapa actualizada':'Etapa creada'); reload(); onClose();
  };
  return(
    <div className="modal-overlay"><div className="modal">
      <h3 className="mb-8" style={{fontSize:22,fontWeight:800}}>{editing?'Editar Etapa':'Nueva Etapa'}</h3>
      <div className="form-group"><label>Nombre *</label><input value={f.nombre} onChange={e=>setF({...f,nombre:e.target.value})}/></div>
      <div className="form-group"><label>Peso (1-10)</label><input type="number" min="1" max="10" value={f.peso} onChange={e=>setF({...f,peso:e.target.value})}/></div>
      <div className="form-group"><label>Responsable</label><select value={f.responsable_id} onChange={e=>setF({...f,responsable_id:e.target.value})}><option value="">Sin asignar</option>{profiles.map(p=><option key={p.id} value={p.id}>{p.nombre}</option>)}</select></div>
      <div className="flex justify-between mt-8"><button className="btn-ghost" onClick={onClose}>Cancelar</button><button className="btn" onClick={save}>Guardar</button></div>
    </div></div>
  );
}

function ProjectHourGrid({projectId,profiles,hours,capacity,vacations,reload}){
  const toast=useContext(ToastCtx);
  const pHours=hours.filter(h=>h.project_id===projectId);
  const startYear=ANIO_ACTUAL;
  const [anio,setAnio]=useState(startYear);
  const [edits,setEdits]=useState({});
  const [dirty,setDirty]=useState(false);

  const getH=(uid,mes)=>{
    const key=`${uid}_${mes}`;
    if(edits[key]!==undefined) return edits[key];
    const rec=pHours.find(h=>h.user_id===uid && h.mes===mes && h.anio===anio);
    return rec?Number(rec.horas_planificadas):0;
  };
  const setH=(uid,mes,val)=>{
    setEdits(e=>({...e,[`${uid}_${mes}`]:Number(val)||0}));
    setDirty(true);
  };
  const getCap=(u,mes)=>{
    const rec=capacity.find(c=>c.user_id===u.id&&c.mes===mes&&c.anio===anio);
    const base=rec?Math.max(0,(rec.horas_totales||160)-(rec.horas_ociosas||0)):(u.horas_disponibles_default||160);
    return Math.max(0,base-calcVacHours(vacations,u.id,mes,anio));
  };
  const getTotalUser=(uid)=>{
    let t=0;
    for(let m=1;m<=12;m++){
      const key=`${uid}_${m}`;
      if(edits[key]!==undefined) t+=edits[key];
      else { const r=pHours.find(h=>h.user_id===uid&&h.mes===m&&h.anio===anio); t+=r?Number(r.horas_planificadas):0; }
    }
    return t;
  };
  const getAllUserHours=(uid,mes)=>hours.filter(h=>h.user_id===uid&&h.mes===mes&&h.anio===anio).reduce((a,b)=>a+Number(b.horas_planificadas),0);

  const save=async()=>{
    for(const key of Object.keys(edits)){
      const [uid,mesStr]=key.split('_');
      const mes=parseInt(mesStr);
      const val=edits[key];
      const existing=pHours.find(h=>h.user_id===uid&&h.mes===mes&&h.anio===anio);
      if(val>0&&existing) await sb.from('hour_assignments').update({horas_planificadas:val}).eq('id',existing.id);
      else if(val>0&&!existing) await sb.from('hour_assignments').insert({project_id:projectId,user_id:uid,mes,anio,horas_planificadas:val});
      else if(val===0&&existing) await sb.from('hour_assignments').delete().eq('id',existing.id);
    }
    setEdits({}); setDirty(false);
    toast('Horas del proyecto guardadas');
    reload();
  };

  return(
    <div style={{marginBottom:60}}>
      <div className="flex justify-between items-center mb-6">
        <h3 className="section-title" style={{marginBottom:0}}>Carga Horaria del Proyecto</h3>
        <div className="flex gap-4 items-center">
          <button className="btn-ghost btn-sm" onClick={()=>{setAnio(a=>a-1);setEdits({});setDirty(false);}}>{anio-1}</button>
          <span className="font-bold text-sm" style={{padding:'6px 16px',background:'var(--surface2)',borderRadius:8}}>{anio}</span>
          <button className="btn-ghost btn-sm" onClick={()=>{setAnio(a=>a+1);setEdits({});setDirty(false);}}>{anio+1}</button>
        </div>
      </div>
      <div className="card p-0 overflow-hidden">
        <div className="custom-scrollbar" style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
            <thead>
              <tr style={{background:'var(--surface2)'}}>
                <th style={{padding:14,textAlign:'left',position:'sticky',left:0,background:'var(--surface2)',zIndex:10,minWidth:170}}>Recurso</th>
                {MESES.map(m=><th key={m} style={{padding:10,textAlign:'center',minWidth:70}}>{m.slice(0,3)}</th>)}
                <th style={{padding:14,textAlign:'center',minWidth:70}}>Total</th>
              </tr>
            </thead>
            <tbody>
              {profiles.map(u=>{
                const totalProj=getTotalUser(u.id);
                return(
                  <tr key={u.id} style={{borderBottom:'1px solid var(--border)'}}>
                    <td style={{padding:12,position:'sticky',left:0,background:'var(--surface)',zIndex:5}}>
                      <div className="flex items-center gap-3"><Avatar name={u.nombre} size={22} color={u.avatar_color}/><span className="font-bold" style={{fontSize:12}}>{u.nombre}</span></div>
                    </td>
                    {MESES.map((_,i)=>{
                      const h=getH(u.id,i+1);
                      const allH=getAllUserHours(u.id,i+1);
                      const mesCap=getCap(u,i+1);
                      const pct=mesCap>0?Math.round((allH/mesCap)*100):0;
                      const over=allH>mesCap;
                      return(
                        <td key={i} style={{padding:2,textAlign:'center',background:over?'rgba(239,68,68,0.08)':'transparent'}}>
                          <input type="number" min="0" max="999" value={h||''} onChange={e=>setH(u.id,i+1,e.target.value)} style={{width:52,textAlign:'center',padding:'4px 2px',fontSize:12,background:h>0?'rgba(59,130,246,0.1)':'var(--surface2)',border:over?'1px solid var(--red)':'1px solid var(--border)',borderRadius:6}} placeholder="-" title={`Disponibles: ${mesCap}h`}/>
                          {allH>0 && <div style={{fontSize:8,marginTop:1,fontWeight:700,color:over?'var(--red)':pct>=80?'var(--yellow)':'var(--green)'}}>{pct}%</div>}
                        </td>
                      )
                    })}
                    <td style={{padding:12,textAlign:'center',fontWeight:900,fontSize:13,color:totalProj>0?'var(--accent)':'var(--muted)'}}>{totalProj>0?totalProj+'h':'-'}</td>
                  </tr>
                )
              })}
            </tbody>
          </table>
        </div>
      </div>
      <div className="flex justify-between items-center mt-4">
        <span className="text-xs text-muted">El % muestra la ocupacion total del recurso (todos los proyectos). Rojo = sobrecarga.</span>
        {dirty && <button className="btn" onClick={save}>Guardar Horas</button>}
      </div>
    </div>
  );
}

function Hours(){
  const {profiles,hours,projects,capacity,vacations}=useContext(DataCtx);
  const [anio,setAnio]=useState(ANIO_ACTUAL);

  const getH=(uid,mes)=>hours.filter(h=>h.user_id===uid && h.mes===mes && h.anio===anio).reduce((a,b)=>a+Number(b.horas_planificadas),0);
  const getCap=(u,mes)=>{
    const rec=capacity.find(c=>c.user_id===u.id&&c.mes===mes&&c.anio===anio);
    const base=rec?Math.max(0,(rec.horas_totales||160)-(rec.horas_ociosas||0)):(u.horas_disponibles_default||160);
    return Math.max(0,base-calcVacHours(vacations,u.id,mes,anio));
  };
  const getBreakdown=(uid,mes)=>hours.filter(h=>h.user_id===uid&&h.mes===mes&&h.anio===anio&&Number(h.horas_planificadas)>0);

  return(
    <div className="animate-in">
      <div className="flex justify-between items-center mb-10">
        <h2 className="section-title" style={{marginBottom:0}}>Resumen de Carga</h2>
        <div className="flex gap-4 items-center">
          <button className="btn-ghost btn-sm" onClick={()=>setAnio(a=>a-1)}>{anio-1}</button>
          <span className="font-bold text-lg p-2 px-4 rounded bg-surface2">{anio}</span>
          <button className="btn-ghost btn-sm" onClick={()=>setAnio(a=>a+1)}>{anio+1}</button>
        </div>
      </div>
      <div className="text-sm text-muted mb-6">Vista consolidada de todos los proyectos. Para asignar horas, ingrese al detalle de cada proyecto.</div>
      <div className="card p-0 overflow-hidden">
        <div className="custom-scrollbar" style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
            <thead>
              <tr style={{background:'var(--surface2)'}}>
                <th style={{padding:16,textAlign:'left',position:'sticky',left:0,background:'var(--surface2)',zIndex:10,minWidth:180}}>Recurso</th>
                {MESES.map(m=><th key={m} style={{padding:12,textAlign:'center',minWidth:80}}>{m.slice(0,3)}</th>)}
                <th style={{padding:16,textAlign:'center'}}>Total Anual</th>
              </tr>
            </thead>
            <tbody>
              {profiles.map(u=>{
                const totalAnual=MESES.reduce((a,_,i)=>a+getH(u.id,i+1),0);
                return(
                  <tr key={u.id} style={{borderBottom:'1px solid var(--border)'}}>
                    <td style={{padding:16,position:'sticky',left:0,background:'var(--surface)',zIndex:5}}>
                      <div className="flex items-center gap-3"><Avatar name={u.nombre} size={24} color={u.avatar_color}/> <span className="font-bold">{u.nombre}</span></div>
                    </td>
                    {MESES.map((_,i)=>{
                      const h=getH(u.id,i+1);
                      const mesCap=getCap(u,i+1);
                      const pct=mesCap>0?Math.round((h/mesCap)*100):0;
                      const over=h>mesCap;
                      const bd=getBreakdown(u.id,i+1);
                      const cellBg=over?'rgba(239,68,68,0.12)':h>0?'rgba(59,130,246,0.06)':'transparent';
                      return(
                        <td key={i} style={{padding:4,textAlign:'center',background:cellBg}} title={bd.map(x=>{const pj=projects.find(p=>p.id===x.project_id);return (pj?.nombre||'?')+': '+x.horas_planificadas+'h';}).join('\n')+'\nDisp: '+mesCap+'h'}>
                          <div style={{padding:'6px 4px',borderRadius:6}}>
                            <div style={{fontWeight:h>0?700:400,fontSize:13,color:over?'var(--red)':h>0?'var(--text)':'var(--muted)'}}>{h||'-'}</div>
                            {h>0 && <div style={{fontSize:9,marginTop:2,fontWeight:600,color:over?'var(--red)':pct>=80?'var(--yellow)':'var(--green)'}}>{pct}%</div>}
                          </div>
                        </td>
                      )
                    })}
                    <td style={{padding:16,textAlign:'center',fontWeight:900,color:'var(--accent)'}}>{totalAnual}h</td>
                  </tr>
                )
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function Config(){
  const {profiles,capacity,vacations,reload}=useContext(DataCtx);
  const toast=useContext(ToastCtx);
  const [anio,setAnio]=useState(ANIO_ACTUAL);
  const [edits,setEdits]=useState({});
  const [dirty,setDirty]=useState(false);

  const getCap=(uid,mes)=>{
    const key=`${uid}_${mes}`;
    if(edits[key]) return edits[key];
    const rec=capacity.find(c=>c.user_id===uid&&c.mes===mes&&c.anio===anio);
    const prof=profiles.find(p=>p.id===uid);
    const defH=prof?.horas_disponibles_default||160;
    return {totales:rec?.horas_totales??defH, ociosas:rec?.horas_ociosas??0};
  };
  const setVal=(uid,mes,field,val)=>{
    const cur=getCap(uid,mes);
    setEdits(e=>({...e,[`${uid}_${mes}`]:{...cur,[field]:Number(val)||0}}));
    setDirty(true);
  };

  const save=async()=>{
    for(const key of Object.keys(edits)){
      const [uid,mesStr]=key.split('_');
      const mes=parseInt(mesStr);
      const v=edits[key];
      const disp=Math.max(0,(v.totales||0)-(v.ociosas||0));
      const existing=capacity.find(c=>c.user_id===uid&&c.mes===mes&&c.anio===anio);
      const payload={user_id:uid,mes,anio,horas_totales:v.totales||160,horas_ociosas:v.ociosas||0,horas_disponibles:disp};
      if(existing) await sb.from('user_capacity').update(payload).eq('id',existing.id);
      else await sb.from('user_capacity').insert(payload);
    }
    setEdits({}); setDirty(false);
    toast('Capacidades actualizadas');
    reload();
  };

  return(
    <div className="animate-in">
      <h2 className="section-title">Configuracion del Sistema</h2>

      <div className="flex justify-between items-center mb-6">
        <h3 style={{fontSize:20,fontWeight:800}}>Capacidad Mensual por Recurso</h3>
        <div className="flex gap-4 items-center">
          <button className="btn-ghost btn-sm" onClick={()=>{setAnio(a=>a-1);setEdits({});setDirty(false);}}>{anio-1}</button>
          <span className="font-bold text-sm" style={{padding:'6px 16px',background:'var(--surface2)',borderRadius:8}}>{anio}</span>
          <button className="btn-ghost btn-sm" onClick={()=>{setAnio(a=>a+1);setEdits({});setDirty(false);}}>{anio+1}</button>
        </div>
      </div>

      {profiles.map(u=>{
        const totalAnual={totales:0,ociosas:0,disp:0};
        MESES.forEach((_,i)=>{const c=getCap(u.id,i+1);const vh=calcVacHours(vacations,u.id,i+1,anio);totalAnual.totales+=c.totales;totalAnual.ociosas+=c.ociosas;totalAnual.disp+=Math.max(0,c.totales-c.ociosas-vh);});
        return(
          <div key={u.id} className="card mb-6" style={{padding:20}}>
            <div className="flex items-center gap-3 mb-4">
              <Avatar name={u.nombre} size={28} color={u.avatar_color}/>
              <span className="font-bold">{u.nombre}</span>
              <span className="badge status-badge" style={{fontSize:10}}>{u.rol}</span>
              <span className="text-xs text-muted" style={{marginLeft:'auto'}}>Anual: {totalAnual.totales}h totales, {totalAnual.ociosas}h ociosas, {totalAnual.disp}h disponibles</span>
            </div>
            <div className="custom-scrollbar" style={{overflowX:'auto'}}>
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:11}}>
                <thead>
                  <tr style={{background:'var(--surface2)'}}>
                    <th style={{padding:8,textAlign:'left',minWidth:90}}></th>
                    {MESES.map(m=><th key={m} style={{padding:6,textAlign:'center',minWidth:62}}>{m.slice(0,3)}</th>)}
                  </tr>
                </thead>
                <tbody>
                  <tr style={{borderBottom:'1px solid var(--border)'}}>
                    <td style={{padding:8,fontSize:11,fontWeight:700,color:'var(--muted)'}}>Totales</td>
                    {MESES.map((_,i)=>{
                      const c=getCap(u.id,i+1);
                      return <td key={i} style={{padding:3,textAlign:'center'}}><input type="number" min="0" max="999" value={c.totales||''} onChange={e=>setVal(u.id,i+1,'totales',e.target.value)} style={{width:50,textAlign:'center',padding:'3px 2px',fontSize:11,borderRadius:4,background:'var(--surface2)',border:'1px solid var(--border)'}} placeholder="160"/></td>
                    })}
                  </tr>
                  <tr style={{borderBottom:'1px solid var(--border)'}}>
                    <td style={{padding:8,fontSize:11,fontWeight:700,color:'var(--orange)'}}>Ociosas</td>
                    {MESES.map((_,i)=>{
                      const c=getCap(u.id,i+1);
                      return <td key={i} style={{padding:3,textAlign:'center'}}><input type="number" min="0" max="999" value={c.ociosas||''} onChange={e=>setVal(u.id,i+1,'ociosas',e.target.value)} style={{width:50,textAlign:'center',padding:'3px 2px',fontSize:11,borderRadius:4,background:'var(--surface2)',border:'1px solid var(--border)'}} placeholder="0"/></td>
                    })}
                  </tr>
                  <tr style={{borderBottom:'1px solid var(--border)'}}>
                    <td style={{padding:8,fontSize:11,fontWeight:700,color:'var(--accent)'}}>Vacaciones</td>
                    {MESES.map((_,i)=>{
                      const vh=calcVacHours(vacations,u.id,i+1,anio);
                      return <td key={i} style={{padding:6,textAlign:'center',fontWeight:600,fontSize:11,color:vh>0?'var(--accent)':'var(--muted)'}}>{vh>0?vh+'h':'-'}</td>
                    })}
                  </tr>
                  <tr>
                    <td style={{padding:8,fontSize:11,fontWeight:700,color:'var(--green)'}}>Disponibles</td>
                    {MESES.map((_,i)=>{
                      const c=getCap(u.id,i+1);
                      const vh=calcVacHours(vacations,u.id,i+1,anio);
                      const disp=Math.max(0,c.totales-c.ociosas-vh);
                      return <td key={i} style={{padding:6,textAlign:'center',fontWeight:700,fontSize:12,color:disp<=0?'var(--red)':'var(--green)'}}>{disp}h</td>
                    })}
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        )
      })}
      {dirty && <div className="flex justify-end mt-4"><button className="btn" onClick={save}>Guardar Capacidades</button></div>}
    </div>
  );
}

function Equipo(){
  const {profiles,hours,reload}=useContext(DataCtx);
  const {profile}=useContext(AuthCtx);
  const toast=useContext(ToastCtx);
  const mesActual=new Date().getMonth()+1;
  const [showForm,setShowForm]=useState(false);
  const [editingMember,setEditingMember]=useState(null);
  const [f,setF]=useState({nombre:'',username:'',rol:'junior',horas_disponibles_default:160,avatar_color:'#3b82f6'});
  const [confirmDel,setConfirmDel]=useState(null);

  const startEdit = (u) => {
    setEditingMember(u);
    setF({
      nombre: u.nombre,
      username: u.username,
      rol: u.rol,
      horas_disponibles_default: u.horas_disponibles_default || 160,
      avatar_color: u.avatar_color
    });
    setShowForm(true);
  };

  const closeForm = () => {
    setShowForm(false);
    setEditingMember(null);
    setF({nombre:'',username:'',rol:'junior',horas_disponibles_default:160,avatar_color:'#3b82f6'});
  };

  const save=async()=>{
    if(!f.nombre||!f.username){toast('Nombre y usuario son requeridos','error');return;}
    const cleanUsername = f.username.toLowerCase().replace(/[^a-z0-9]/g, '');
    const payload = {
      nombre: f.nombre,
      username: cleanUsername,
      rol: f.rol,
      avatar_color: f.avatar_color
    };

    if (editingMember) {
      const {error} = await sb.from('profiles').update(payload).eq('id', editingMember.id);
      if(error){
        toast('Error al actualizar integrante: ' + error.message, 'error');
      } else {
        toast('Integrante actualizado con éxito','success');
        closeForm();
        reload();
      }
    } else {
      payload.horas_disponibles_default = 160; // 160h base por defecto, se configura mes a mes en Configuración
      const {error} = await sb.from('profiles').insert(payload);
      if(error){
        toast('Error al crear miembro. Verificá que el usuario no esté duplicado: ' + error.message, 'error');
      } else {
        toast('¡Integrante agregado! Ya aparece en proyectos, horas y dashboards.','success');
        closeForm();
        reload();
      }
    }
  };

  const del=async(id)=>{
    const member = profiles.find(p=>p.id===id);
    const isSystemUser = member?.auth_user_id || member?.id === profile?.id;
    if(isSystemUser){
      toast('No podés eliminar un usuario administrador registrado', 'error');
      return;
    }
    const {error} = await sb.from('profiles').delete().eq('id',id);
    if(error){
      toast('Error al eliminar: ' + error.message, 'error');
    } else {
      toast('Integrante eliminado','success');
      reload();
    }
  };

  const isRegistered=(u)=> u?.auth_user_id || u?.id === profile?.id;
  const getHorasMes=(uid)=>hours.filter(h=>h.user_id===uid&&h.mes===mesActual&&h.anio===ANIO_ACTUAL).reduce((a,b)=>a+Number(b.horas_planificadas),0);
  const getCapMes=(u)=>u.horas_disponibles_default||160;

  return(
    <div className="animate-in">
      <div className="flex justify-between items-center mb-4">
        <div>
          <h2 className="section-title" style={{marginBottom:4}}>Mi Equipo</h2>

        </div>
        <button className="btn" onClick={()=>setShowForm(true)}>+ Agregar Integrante</button>
      </div>

      <div className="card mb-8" style={{padding:'12px 20px',display:'flex',alignItems:'center',gap:24,background:'rgba(59,130,246,0.05)',border:'1px solid rgba(59,130,246,0.2)'}}>
        <div style={{fontSize:28,fontWeight:900,color:'var(--accent)'}}>{profiles.length}</div>
        <div className="text-sm text-muted">integrantes en tu equipo</div>
        <div style={{marginLeft:'auto',fontSize:28,fontWeight:900,color:'var(--green)'}}>{profiles.filter(u=>!isRegistered(u)).length}</div>
        <div className="text-sm text-muted">virtuales (sin login)</div>
        <div style={{marginLeft:'auto',fontSize:28,fontWeight:900,color:'var(--accent)'}}>{profiles.filter(u=>isRegistered(u)).length}</div>
        <div className="text-sm text-muted">administradores con cuenta</div>
      </div>

      {showForm && (
        <div className="card mb-10" style={{maxWidth:520}}>
          <h3 className="mb-6" style={{fontSize:18,fontWeight:800}}>{editingMember ? 'Editar Integrante' : 'Nuevo Integrante del Equipo'}</h3>
          <div className="form-group"><label>Nombre Completo *</label><input value={f.nombre} onChange={e=>setF({...f,nombre:e.target.value})} placeholder="Ej. Juan Pérez"/></div>
          <div className="form-group"><label>Usuario * (sin espacios ni caracteres especiales)</label><input value={f.username} onChange={e=>setF({...f,username:e.target.value})} placeholder="ej. juanperez" disabled={editingMember && isRegistered(editingMember)}/></div>
          <div className="grid" style={{gridTemplateColumns:'1fr',gap:16}}>
            <div className="form-group">
              <label>Rol</label>
              <select value={f.rol} onChange={e=>setF({...f,rol:e.target.value})}>
                <option value="junior">Junior</option>
                <option value="semisenior">SemiSenior</option>
                <option value="senior">Senior</option>
                <option value="gerente">Gerente</option>

                <div key={c} onClick={()=>setF({...f,avatar_color:c})} style={{width:28,height:28,borderRadius:'50%',background:c,cursor:'pointer',border:f.avatar_color===c?'3px solid white':'3px solid transparent',boxShadow:f.avatar_color===c?`0 0 0 2px ${c}`:'none',transition:'.2s'}}/>

          </div>
        </div>
      )}

      <div className="grid" style={{gridTemplateColumns:'repeat(auto-fill, minmax(280px, 1fr))',gap:20}}>
        {profiles.map(u=>{
          const horasMes=getHorasMes(u.id);
          const capMes=getCapMes(u);
          const pct=capMes>0?Math.round((horasMes/capMes)*100):0;
          const over=horasMes>capMes;
          return(
            <div key={u.id} className="card" style={{padding:20}}>
              <div className="flex items-center gap-4 mb-4">
                <Avatar name={u.nombre} color={u.avatar_color} size={44}/>
                <div className="flex-1">
                  <div className="font-bold flex items-center gap-2">
                    {u.nombre}
                    {isRegistered(u)
                      ? <span className="badge" style={{background:'var(--accent)',color:'#fff',fontSize:8,padding:'2px 6px'}}>ADMIN</span>
                      : <span className="badge" style={{background:'var(--surface2)',color:'var(--muted)',fontSize:8,padding:'2px 6px'}}>VIRTUAL</span>
                    }
                  </div>
                  <div className="text-xs text-muted">@{u.username} · {u.rol.toUpperCase()}</div>
                </div>
              </div>
              <div style={{marginBottom:10}}>
                <div className="flex justify-between text-xs mb-1">
                  <span className="text-muted">Carga {MESES[mesActual-1]}</span>
                  <span style={{fontWeight:700,color:over?'var(--red)':pct>=80?'var(--yellow)':'var(--green)'}}>{horasMes>0?`${horasMes}h / ${capMes}h (${pct}%)`:`Sin horas asignadas`}</span>
                </div>
                {horasMes>0 && <ProgressBar value={Math.min(pct,100)} color={over?'var(--red)':pct>=80?'var(--yellow)':'var(--green)'}/>}
              </div>
              <div className="flex justify-between items-center" style={{borderTop:'1px solid var(--border)',paddingTop:12}}>
                <span className="text-xs text-muted">{capMes}h disponibles/mes</span>
                <div className="flex gap-2">
                  <button className="btn-ghost btn-sm" style={{fontSize:11,padding:'4px 8px'}} onClick={()=>startEdit(u)}>Editar</button>
                  {!isRegistered(u) && (
                    <button className="btn-danger btn-sm" style={{fontSize:11,padding:'4px 8px'}} onClick={()=>setConfirmDel(u.id)}>Eliminar</button>
                  )}
                </div>
              </div>
            </div>
          );
        })}
      </div>
      <ConfirmModal open={!!confirmDel} onClose={()=>setConfirmDel(null)} onConfirm={()=>del(confirmDel)} title="¿Eliminar este integrante del equipo?"/>
    </div>
  );
}

function MainLayout(){
  const {profile}=useContext(AuthCtx);
  const [page,setPage]=useState('dashboard');
  const [selId,setSelId]=useState(null);
  const [dark,setDark]=useState(()=>{const s=localStorage.getItem('tf_dark');return s===null?true:s==='true';});
  useEffect(()=>{document.body.className=dark?'':'light';localStorage.setItem('tf_dark',dark);},[dark]);

  const render=()=>{
    switch(page){
      case 'dashboard': return <Dashboard/>;
      case 'projects': return <ProjectList onSelect={(id)=>{setSelId(id);setPage('detail');}}/>;
      case 'detail': return <ProjectDetail projectId={selId} setPage={setPage}/>;
      case 'tasks': return <Tasks/>;
      case 'hours': return <Hours/>;
      case 'vacations': return <Vacations/>;
      case 'audit': return <Audit/>;
      case 'config': return <Config/>;
      case 'equipo': return <Equipo/>;
      default: return <Dashboard/>;
    }
  };

  return(
    <div className="layout">
      <div className="sidebar">
        <div className="p-8 mb-4"><h1 style={{color:'var(--accent)',fontSize:24,fontWeight:900,letterSpacing:'-1px'}}>TeamFlow</h1></div>
        <div className={`nav-item ${page==='dashboard'?'active':''}`} onClick={()=>setPage('dashboard')}>Tablero General</div>
        <div className={`nav-item ${page==='projects'||page==='detail'?'active':''}`} onClick={()=>setPage('projects')}>Gestion Proyectos</div>
        <div className={`nav-item ${page==='tasks'?'active':''}`} onClick={()=>setPage('tasks')}>Muro de Tareas</div>
        <div className={`nav-item ${page==='hours'?'active':''}`} onClick={()=>setPage('hours')}>Carga Horaria</div>
        <div className={`nav-item ${page==='vacations'?'active':''}`} onClick={()=>setPage('vacations')}>Vacaciones</div>
        {isAdmin(profile?.rol) && <div className={`nav-item ${page==='equipo'?'active':''}`} onClick={()=>setPage('equipo')}>Mi Equipo</div>}
        {isAdmin(profile?.rol) && <div className={`nav-item ${page==='audit'?'active':''}`} onClick={()=>setPage('audit')}>Auditoria</div>}
        {isAdmin(profile?.rol) && <div className={`nav-item ${page==='config'?'active':''}`} onClick={()=>setPage('config')}>Configuracion</div>}
        <div className="mt-auto p-6"><button className="btn-ghost w-full btn-sm" onClick={()=>sb.auth.signOut()}>Cerrar Sesion</button></div>
      </div>
      <div className="main">
        <header className="header">
          <div className="flex items-center gap-4">
            <span style={{color:'var(--muted)',fontSize:14}}>Sesion de:</span>
            <Avatar name={profile?.nombre} size={32} color={profile?.avatar_color}/>
            <strong style={{fontSize:15}}>{profile?.nombre}</strong>
            <span className="badge status-badge" style={{fontSize:9}}>{profile?.rol}</span>
          </div>
          <button className="toggle-theme" onClick={()=>setDark(d=>!d)}>{dark?'Modo Claro':'Modo Oscuro'}</button>
        </header>
        <div className="content custom-scrollbar">{render()}</div>
      </div>
    </div>
  );
}

function ResetPassword({onComplete}){
  const [newPass,setNewPass]=useState('');
  const toast=useContext(ToastCtx);
  const handle=async(e)=>{
    e.preventDefault();
    if(newPass.length < 6){
      toast('La contraseña debe tener al menos 6 caracteres','error');
      return;
    }
    const {error}=await sb.auth.updateUser({password:newPass});
    if(error){
      toast(error.message,'error');
    } else {
      toast('Contraseña restablecida con éxito','success');
      // Clean hash from URL
      window.history.replaceState(null, null, window.location.pathname);
      onComplete();
    }
  };
  return(
    <div className="flex items-center justify-center" style={{minHeight:'100vh',background:'radial-gradient(circle at top right, var(--surface), var(--bg))'}}>
      <div className="card animate-in" style={{width:400,padding:40}}>
        <h1 style={{textAlign:'center',marginBottom:20,fontSize:32,fontWeight:900,color:'var(--accent)'}}>TeamFlow</h1>
        <h3 className="mb-6" style={{textAlign:'center',fontSize:16,fontWeight:600}}>Restablecer Contraseña</h3>
        <p className="text-xs text-muted mb-6 text-center">Ingresá tu nueva contraseña para acceder a tu cuenta.</p>
        <form onSubmit={handle} className="flex flex-col gap-6">
          <div className="form-group"><label>Nueva Contraseña</label><input type="password" value={newPass} onChange={e=>setNewPass(e.target.value)} required placeholder="Mínimo 6 caracteres"/></div>
          <button className="btn w-full" style={{padding:14,fontSize:16}}>Actualizar Contraseña</button>
        </form>
      </div>
    </div>
  );
}

function App(){
  const {user,profile,loading}=useContext(AuthCtx);
  const [isRecovering,setIsRecovering]=useState(false);
  useEffect(()=>{
    if(window.location.hash && window.location.hash.includes('type=recovery')){
      setIsRecovering(true);
    }
  },[]);

  if(loading) return <div className="flex items-center justify-center" style={{height:'100vh',background:'var(--bg)'}}><div style={{color:'var(--muted)',fontWeight:600,fontSize:18}}>Cargando TeamFlow...</div></div>;
  if(isRecovering) return <ResetPassword onComplete={()=>setIsRecovering(false)}/>;
  return user && profile ? <MainLayout/> : <Login/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<ToastProvider><AuthProvider><DataProvider><App/></DataProvider></AuthProvider></ToastProvider>);
</script>
</body>
</html>
